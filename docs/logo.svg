<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Loom logo">
  <defs>
    <linearGradient id="lm-warp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34c3b2"/>
      <stop offset="1" stop-color="#1f8f83"/>
    </linearGradient>
    <linearGradient id="lm-weft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa94d"/>
      <stop offset="1" stop-color="#e57a1f"/>
    </linearGradient>
  </defs>
  <!-- warp: vertical threads -->
  <g fill="url(#lm-warp)">
    <rect x="20" y="12" width="20" height="104" rx="10"/>
    <rect x="54" y="12" width="20" height="104" rx="10"/>
    <rect x="88" y="12" width="20" height="104" rx="10"/>
  </g>
  <!-- weft: horizontal threads, woven over the warp -->
  <g fill="url(#lm-weft)">
    <rect x="12" y="20" width="104" height="20" rx="10"/>
    <rect x="12" y="54" width="104" height="20" rx="10"/>
    <rect x="12" y="88" width="104" height="20" rx="10"/>
  </g>
  <!-- restore over-under: warp segments that pass over the weft -->
  <g fill="url(#lm-warp)">
    <rect x="20" y="20" width="20" height="20" rx="7"/>
    <rect x="88" y="20" width="20" height="20" rx="7"/>
    <rect x="54" y="54" width="20" height="20" rx="7"/>
    <rect x="20" y="88" width="20" height="20" rx="7"/>
    <rect x="88" y="88" width="20" height="20" rx="7"/>
  </g>
</svg>
